[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imoltance"
version = "0.1.4"
requires-python = ">=3.10"

dependencies = [
    "pandas",
    "scikit-learn",
    "rdkit",
    "numpy"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]